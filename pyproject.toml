[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scc-browser"
version = "0.1.0"
description = "Browse and install community Star Citizen characters from star-citizen-characters.com"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.urls]
Homepage = "https://github.com/cptn-cosmo/scc-browser"

[project.gui-scripts]
scc-browser = "scc_browser.__main__:main"

[tool.setuptools]
packages = ["scc_browser"]

[tool.setuptools.package-data]
scc_browser = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
